<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Java Data Graph</title>
    <link rel="stylesheet" href="style.css" onerror="document.body.innerHTML='<pre style=color:blue;padding:20px>❌ ERROR: style.css not found.</pre>' + document.body.innerHTML"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<header>
    <h1>Java Data Graph</h1>
    <p>ArrayList&lt;Integer&gt; &rarr; Live Visualization</p>
</header>
<main>
    <div class="card">
        <p class="chart-title">&#9616; Bar Chart</p>
        <div id="barChart" class="status">
            <p id="loadingText">Fetching from Java server...</p>
        </div>
    </div>
    
    <div id="statsRow" style="display:none">
        <div class="stats" id="stats"></div>
    </div>
    <div class="btn-row">
        <button class="btn" onclick="loadData()">&#8634; Refresh Data</button>
    </div>
     <div id="errors" style="display:none; background:#1a0a0f; border:1px solid #ff3f6c; border-radius:8px; margin-top:16px;"></div>
      
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="code.js"></script>
</body>
</html>
